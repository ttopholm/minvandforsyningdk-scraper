name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    
    - name: Run unit tests with pytest
      env:
        mqtt-broker: test-broker
        username: test-user
        password: test-pass
      run: |
        pytest tests/ -v -m "not integration" --cov=app --cov-report=term-missing --cov-report=xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      if: matrix.python-version == '3.12'
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  integration-test:
    runs-on: ubuntu-latest
    # the job takes about 4 minutes, so this only catches something being stuck
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    
    - name: Start Mosquitto MQTT broker
      run: |
        docker run -d --name mosquitto -p 1883:1883 eclipse-mosquitto:2 mosquitto -c /mosquitto-no-auth.conf
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    
    - name: Install the playwright browser
      # no --with-deps: the apt install it runs hangs now and then, and the
      # runner image already carries the libraries chromium needs. If one is
      # ever missing the integration tests fail here instead of skipping.
      run: playwright install chromium
    
    - name: Wait for the MQTT broker to be ready
      run: |
        timeout 30 bash -c 'until nc -z localhost 1883; do sleep 2; done'
        echo "MQTT broker is ready!"
    
    - name: Run integration tests
      env:
        mqtt-broker: localhost
        mqtt-port: "1883"
        username: test-user
        password: test-pass
      run: |
        pytest tests/ -v -m "integration" --tb=long
    
    - name: Stop Mosquitto
      if: always()
      run: |
        docker stop mosquitto || true
        docker rm mosquitto || true
