services:
  minvandforsyning:
    image: ghcr.io/ttopholm/minvandforsyningdk-scraper:latest
    restart: always
    # chromium needs more than the default 64m of shared memory
    shm_size: '1g'
    environment:
      - mqtt-broker=[mqtt host]
      - username=[username]
      - password=[password]
      # the readings are danish wall clock time
      - TZ=Europe/Copenhagen
      # optional, see the readme for the full list
      # - retry-interval=300
      # - debug-dir=/debug
      # - mqtt-discovery=false
    # volumes:
    #   - ./debug:/debug
