services:
  selenium:
    image: selenium/standalone-chrome:latest
    shm_size: '2g'
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://selenium:4444/wd/hub/status"]
      interval: 20s
      timeout: 10s
      retries: 3

  minvandforsyning:
    image: ghcr.io/ttopholm/minvandforsyningdk-scraper:latest
    restart: always
    environment:
      - webdriver-remote-url=http://selenium:4444
      - mqtt-broker=[mqtt host]
      - username=[username]
      - password=[password]
      # the readings are danish wall clock time
      - TZ=Europe/Copenhagen
      # optional, see the readme for the full list
      # - retry-interval=300
      # - debug-dir=/debug
      # - mqtt-discovery=false
    # volumes:
    #   - ./debug:/debug
    depends_on:
      selenium:
        condition: service_healthy
